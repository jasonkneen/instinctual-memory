[package]
name = "mem"
version = "1.0.0"
edition = "2021"
description = "Git-first durable memory for AI agents: backfill sessions, consolidate facts, search, and write back to AGENTS.md"
license = "Apache-2.0"
readme = "README.md"
rust-version = "1.88"
repository = "https://github.com/jasonkneen/instinctual-memory"
keywords = ["agents", "memory", "mcp", "git", "llm"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mem"
path = "src/main.rs"

[lib]
name = "mem"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
fs4 = { version = "0.7", features = ["sync"] }
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1"
walkdir = "2"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
toml = "0.8"
fastembed = { version = "7", default-features = false, features = ["ort-download-binaries", "hf-hub"] }
parking_lot = "0.12"
once_cell = "1"
rayon = "1"
memchr = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1